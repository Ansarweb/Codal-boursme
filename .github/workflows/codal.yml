                  re.I
              ):

                  result.append(
                      "گزارش ماهانه"
                  )


              # -----------------------------
              # صورت‌های مالی
              # -----------------------------

              financial = re.search(

                  r"صورت.?ها[یي].?مالی|"
                  r"اطلاعات\s+و\s+صورت",

                  t,

                  re.I

              )


              if financial:

                  result.append(
                      "صورت مالی"
                  )


              # -----------------------------
              # دوره مالی
              # -----------------------------

              if re.search(
                  r"۳\s*ماهه|3\s*ماهه",
                  t,
                  re.I
              ):

                  result.append(
                      "۳ ماهه"
                  )


              if re.search(
