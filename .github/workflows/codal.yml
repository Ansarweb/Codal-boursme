                  r"توضیحات?\s+در\s+خصوص",

                  r"توضيحات?\s+در\s+خصوص",

                  r"اصلاحیه.*توضیحات",

                  r"تمدید.*مهلت",

                  r"رفع.*ابهام"

              ]


              for pattern in ignore_patterns:

                  if re.search(
                      pattern,
                      t,
                      re.I
                  ):

                      return []


              result = []


