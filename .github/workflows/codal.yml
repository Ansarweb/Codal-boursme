name: Boursme Codal Monitor

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: boursme-codal
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Read and filter Codal
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |
          python - <<'PY'

          import os
          import re
          import json
          import requests
          from bs4 import BeautifulSoup


          SOURCE_URL = "https://t.me/s/codal"
          STATE_FILE = "codal_state.json"

          TOKEN = os.environ["TELEGRAM_BOT_TOKEN"]
          CHAT_ID = os.environ["TELEGRAM_CHAT_ID"]


          # =====================================
          # State
          # =====================================

          try:
              with open(STATE_FILE, "r", encoding="utf-8") as f:
                  state = json.load(f)

              last_id = int(state.get("last_id", 0))

          except Exception:
              last_id = 0


          print("LAST ID:", last_id)


          # =====================================
          # Download channel
          # =====================================

          response = requests.get(
              SOURCE_URL,
              headers={
                  "User-Agent": "Mozilla/5.0"
              },
              timeout=40
          )

          response.raise_for_status()

          soup = BeautifulSoup(
              response.text,
              "html.parser"
          )


          # =====================================
          # Extract posts
          # =====================================

          posts = []

          for message in soup.select(
              ".tgme_widget_message"
          ):

              data_post = message.get(
                  "data-post",
                  ""
              )

              if "/" not in data_post:
                  continue

              try:
                  post_id = int(
                      data_post.rsplit("/", 1)[1]
                  )
              except Exception:
                  continue

              if post_id <= last_id:
                  continue

              text_el = message.select_one(
                  ".tgme_widget_message_text"
              )

              if not text_el:
                  continue

              text = text_el.get_text(
                  "\n",
                  strip=True
              )

              posts.append({
                  "id": post_id,
                  "text": text,
                  "url":
                  f"https://t.me/codal/{post_id}"
              })


          posts.sort(
              key=lambda x: x["id"]
          )


          print("NEW POSTS:", len(posts))


          # =====================================
          # Symbol
          # =====================================

          def symbol(text):

              m = re.search(
                  r"#([آ-یA-Za-z0-9_]+)",
                  text
              )

              if m:
                  return m.group(1)

              return "نامشخص"


          # =====================================
          # Classification
          # =====================================

          def classify(text):

              t = text.replace(
                  "‌",
                  ""
              ).lower()


