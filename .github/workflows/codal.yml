name: Codal Boursme

on:
  workflow_dispatch:

jobs:
  test-codal:
    runs-on: ubuntu-latest

    steps:
      - name: Read Codal360
        run: |
          python - <<'PY'
          import requests
          from bs4 import BeautifulSoup

          url = "https://t.me/s/Codal360_ir"

          headers = {
              "User-Agent": "Mozilla/5.0"
          }

          r = requests.get(url, headers=headers, timeout=30)

          print("STATUS:", r.status_code)
          print("LENGTH:", len(r.text))

          if r.status_code != 200:
              raise Exception("Telegram channel could not be accessed")

          soup = BeautifulSoup(r.text, "html.parser")

          messages = soup.select(".tgme_widget_message")

          print("MESSAGES FOUND:", len(messages))

          for message in messages[-5:]:
              text = message.select_one(".tgme_widget_message_text")

              if text:
                  print("=" * 60)
                  print(text.get_text(" ", strip=True)[:1000])

          print("=" * 60)
          print("CODAL360 CONNECTION: OK")
          PY
