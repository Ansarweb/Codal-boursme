name: Codal Direct API Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Find Codal report
        run: |
          python - <<'PY'

          import requests
          import urllib.parse
          import json

          SYMBOL = "وفردانامه"

          API = (
              "https://search.codal.ir/api/search/v2/q?"
              + urllib.parse.urlencode({
                  "Symbol": SYMBOL,
                  "PageNumber": 1,
                  "Length": 20
              })
          )

          print("=" * 70)
          print("CODAL DIRECT API TEST")
          print("=" * 70)

          print("SYMBOL:", SYMBOL)
          print("API:", API)

          response = requests.get(
              API,
              headers={
                  "User-Agent": "Mozilla/5.0",
                  "Accept": "application/json"
              },
              timeout=40
          )

          print()
          print("HTTP:", response.status_code)

          response.raise_for_status()

          data = response.json()

          letters = data.get(
              "Letters",
              []
          )

          print(
              "RESULTS:",
              len(letters)
          )

          print()

          for letter in letters:

              print("=" * 70)

              print(
                  "TRACING NO:",
                  letter.get("TracingNo")
              )

              print(
                  "SYMBOL:",
                  letter.get("Symbol")
              )

              print(
                  "TITLE:",
                  letter.get("Title")
              )

              print(
                  "DATE:",
                  letter.get("SentDateTime")
              )

              print(
                  "HAS EXCEL:",
                  letter.get("HasExcel")
              )

              print(
                  "HAS PDF:",
                  letter.get("HasPdf")
              )

              print(
                  "HAS ATTACHMENT:",
                  letter.get("HasAttachment")
              )

              print(
                  "LETTER SERIAL:",
                  letter.get("LetterSerial")
              )

              print(
                  "URL:",
                  letter.get("Url")
              )

              print(
                  "PDF URL:",
                  letter.get("PdfUrl")
              )

              print(
                  "EXCEL URL:",
                  letter.get("ExcelUrl")
              )

              print(
                  "ATTACHMENT URL:",
                  letter.get("AttachmentUrl")
              )

          print()
          print("=" * 70)
          print("CODAL API TEST: OK")
          print("=" * 70)

          PY
