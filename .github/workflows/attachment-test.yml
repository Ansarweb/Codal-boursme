name: Codal Attachment Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Test TSETMC connectivity
        run: |
          echo "=========================================="
          echo "TEST 1: DNS"
          echo "=========================================="

          getent hosts tsetmc.com || true
          getent hosts cdn.tsetmc.com || true

          echo
          echo "=========================================="
          echo "TEST 2: tsetmc.com"
          echo "=========================================="

          curl -I -L \
            --connect-timeout 15 \
            --max-time 30 \
            https://www.tsetmc.com/ \
            || true

          echo
          echo "=========================================="
          echo "TEST 3: cdn.tsetmc.com"
          echo "=========================================="

          curl -I -L \
            --connect-timeout 15 \
            --max-time 30 \
            https://cdn.tsetmc.com/ \
            || true

          echo
          echo "=========================================="
          echo "TEST 4: TSETMC API"
          echo "=========================================="

          curl -v \
            --connect-timeout 15 \
            --max-time 30 \
            -H "User-Agent: Mozilla/5.0" \
            "https://cdn.tsetmc.com/api/Codal/GetFileAttachmentByTracingNo/463194" \
            || true

          echo
          echo "=========================================="
          echo "TEST FINISHED"
          echo "=========================================="
