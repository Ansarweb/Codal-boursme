name: Codal Boursme

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: codal-boursme
  cancel-in-progress: false

jobs:
  codal:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Read Codal360 and send important reports
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import re
          import json
          import requests
          from bs4 import BeautifulSoup

          CHANNEL = "https://t.me/s/Codal360_ir"
          STATE_FILE = "data/codal_state.json"

          os.makedirs("data", exist_ok=True)

          if os.path.exists(STATE_FILE):
              try:
                  with open(STATE_FILE, "r", encoding="utf-8") as f:
                      state = json.load(f)
              except:
                  state = {"last_id": 0}
          else:
              state = {"last_id": 0}

          last_id = int(state.get("last_id", 0))

          headers = {
              "User-Agent": "Mozilla/5.0 (Android 10; Mobile) AppleWebKit/537.36 Chrome/130 Safari/537.36"
          }

          r = requests.get(CHANNEL, headers=headers, timeout=30)
          r.raise_for_status()

          soup = BeautifulSoup(r.text, "html.parser")

          posts = []

          for msg in soup.select(".tgme_widget_message"):
              data_post = msg.get("data-post", "")
              if "/" not in data_post:
                  continue

              try:
                  post_id = int(data_post.rsplit("/", 1)[1])
              except:
                  continue

              text_el = msg.select_one(".tgme_widget_message_text")
              if not text_el:
                  continue

              text = text_el.get_text("\n", strip=True)

              posts.append({
                  "id": post_id,
                  "text": text,
                  "url": f"https://t.me/Codal360_ir/{post_id}"
              })

          posts.sort(key=lambda x: x["id"])

          important_patterns = [
              r"گزارش.?فعالیت.?ماهانه",
              r"صورت.?های.?مالی",
              r"دوره.?1.?ماهه",
              r"دوره.?3.?ماهه",
              r"دوره.?6.?ماهه",
              r"دوره.?9.?ماهه",
              r"دوره.?12.?ماهه",
              r"افزایش.?سرمایه",
              r"پیشنهاد.*افزایش.?سرمایه",
              r"گزارش.?توجیهی.*افزایش.?سرمایه",
              r"افشای.?اطلاعات.?بااهمیت",
              r"اطلاعات.?بااهمیت",
              r"شفاف.?سازی",
          ]

          def is_important(text):
              return any(re.search(p, text, re.I) for p in important_patterns)

          new_posts = [
              p for p in posts
              if p["id"] > last_id and is_important(p["text"])
          ]

          bot_token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]

          def send(text):
              url = f"https://api.telegram.org/bot{bot_token}/sendMessage"
              resp = requests.post(
                  url,
                  json={
                      "chat_id": chat_id,
                      "text": text,
                      "disable_web_page_preview": True
                  },
                  timeout=30
              )
              resp.raise_for_status()

          max_seen = last_id

          for p in posts:
              max_seen = max(max_seen, p["id"])

          for p in new_posts:
              text = p["text"]

              # محدود کردن طول پیام
              if len(text) > 3500:
                  text = text[:3500] + "\n…"

              message = (
                  "📊 گزارش مهم کدال\n\n"
                  f"{text}\n\n"
                  f"🔗 مشاهده اطلاعیه: {p['url']}"
              )

              send(message)

          state["last_id"] = max_seen

          with open(STATE_FILE, "w", encoding="utf-8") as f:
              json.dump(state, f, ensure_ascii=False, indent=2)

          print(f"Found {len(posts)} posts")
          print(f"New important posts: {len(new_posts)}")
          print(f"Last ID: {max_seen}")
          PY

      - name: Save state
        run: |
          git config user.name "Codal Boursme Bot"
          git config user.email "bot@users.noreply.github.com"

          git add data/codal_state.json

          if git diff --cached --quiet; then
            echo "No state changes"
          else
            git commit -m "Update Codal state"
            git push
          fi
